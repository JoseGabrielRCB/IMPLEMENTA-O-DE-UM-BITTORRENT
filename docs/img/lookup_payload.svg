<svg xmlns="http://www.w3.org/2000/svg" style="background:#fff" viewBox="0 0 760 210" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14"><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ar-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker><marker id="ar-cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="10.0" y="20.9" font-size="14" text-anchor="start" font-weight="bold" fill="#0f766e">Resposta ACK do LOOKUP por nome (MSG_LOOKUP = 3) depois do CP3</text><rect x="10.0" y="30.0" width="470.0" height="46.0" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="245.0" y="55.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">metadado serializado (CP2, igual ao antes)</text><text x="245.0" y="93.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">object_id | name_len | name | size | chunks | version | owner</text><rect x="480.0" y="30.0" width="80.0" height="46.0" rx="0" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="520.0" y="55.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">count</text><text x="520.0" y="93.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">uint32</text><rect x="560.0" y="30.0" width="190.0" height="46.0" rx="0" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="655.0" y="55.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">ProviderInfo × count</text><text x="655.0" y="93.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">18 bytes cada</text><line x1="560.0" y1="100.0" x2="470.0" y2="132.0" stroke="#0f766e" stroke-width="1.3"/><line x1="740.0" y1="100.0" x2="740.0" y2="132.0" stroke="#0f766e" stroke-width="1.3"/><rect x="470.0" y="132.0" width="170.0" height="46.0" rx="0" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="555.0" y="157.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">ip</text><text x="555.0" y="195.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">char[16]</text><rect x="640.0" y="132.0" width="100.0" height="46.0" rx="0" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="690.0" y="157.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">port</text><text x="690.0" y="195.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">uint16</text><text x="10.0" y="154.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">Só a parte verde é nova. O peer usa</text><text x="10.0" y="172.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">separar_provedores para achar onde</text><text x="10.0" y="190.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">o metadado termina.</text></svg>