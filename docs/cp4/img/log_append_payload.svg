END (26)  sem padding, ordem de bytes da máquina</text><rect x="10.0" y="32.0" width="150.0" height="46.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="85.0" y="58.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">campos</text><text x="85.0" y="96.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">73 bytes</text><rect x="160.0" y="32.0" width="80.0" height="46.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="200.0" y="58.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">checksum</text><text x="200.0" y="96.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">32</text><rect x="240.0" y="32.0" width="80.0" height="46.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="280.0" y="58.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">meta_len</text><text x="280.0" y="96.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">uint32</text><rect x="320.0" y="32.0" width="260.0" height="46.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="450.0" y="58.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">metadado</text><text x="450.0" y="96.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">metadata_serialize</text><rect x="580.0" y="32.0" width="180.0" height="46.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="670.0" y="58.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">provider_id</text><text x="670.0" y="96.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">32 bytes</text><text x="10.0" y="120.0" font-size="12" text-anchor="start" font-weight="normal" fill="#475569" font-family="Cascadia Mono, Consolas, monospace">campos = log_index | txid | op | object_id | timestamp | version</text><path d="M10,140 L10,150 L160,150 L160,140" fill="none" stroke="#4338ca" stroke-width="1.4"/><path d="M320,140 L320,150 L760,150 L760,140" fill="none" stroke="#4338ca" stroke-width="1.4"/><line x1="160.0" y1="150.0" x2="320.0" y2="150.0" stroke="#4338ca" stroke-width="1.4" stroke-dasharray="4 4"/><text x="385.0" y="172.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#4338ca">SHA-256 sobre estas três partes = checksum (o próprio checksum e o meta_len ficam fora)</text><text x="10.0" y="205.0" font-size="13" text-anchor="start" font-weight="normal" fill="#475569">Leitura: tamanho &gt;= 109 + 32 antes de ler a parte fixa; meta_len tem de ser igual a</text><text x="10.0" y="223.0" font-size="13" text-anchor="start" font-weight="normal" fill="#475569">tamanho - 109 - 32; log_index 0 e operação diferente de PUT são recusados.</text></svg>