0.0" y="175.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#15803d">FOLLOWER</text><circle cx="395.0" cy="170.0" r="62" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="395.0" y="175.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#b45309">CANDIDATE</text><circle cx="680.0" cy="170.0" r="62" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5"/><text x="680.0" y="175.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f766e">COORDINATOR</text><line x1="174.0" y1="160.0" x2="330.0" y2="160.0" stroke="#1e293b" stroke-width="2" marker-end="url(#ar-ink)"/><text x="252.0" y="118.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1e293b">sem coordenador,</text><text x="252.0" y="134.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1e293b">coordenador SUSPECT</text><text x="252.0" y="150.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1e293b">ou pedido de ELECTION</text><line x1="459.0" y1="160.0" x2="615.0" y2="160.0" stroke="#1e293b" stroke-width="2" marker-end="url(#ar-ink)"/><text x="537.0" y="136.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e293b">nenhum OK</text><text x="537.0" y="152.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#475569">dos maiores</text><path d="M370,112 C 340,40 450,40 420,112" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ar-amber)"/><text x="395.0" y="36.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#b45309">recebeu OK e o prazo de 5 s venceu: nova eleição</text><path d="M395,234 C 395,280 110,280 110,236" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ar-green)"/><path d="M680,234 C 680,310 110,310 116,236" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ar-green)"/><text x="395.0" y="300.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#15803d">recebeu COORDINATOR: grava o coordenador e vira FOLLOWER</text>