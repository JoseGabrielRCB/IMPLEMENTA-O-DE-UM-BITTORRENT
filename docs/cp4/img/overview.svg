 (Aluno 1): o maior NodeID vivo é o coordenador</text><text x="20.0" y="50.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">e reanuncia COORDINATOR a cada 5 s.</text><text x="20.0" y="78.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#4338ca">Log SMR (Aluno 2): todo PUT passa pelo coordenador e</text><text x="20.0" y="98.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">é aplicado na mesma ordem em todos os Super Peers.</text><rect x="20.0" y="175.0" width="120.0" height="58.0" rx="6" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80.0" y="201.9" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#334155">Peer</text><text x="80.0" y="223.9" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">bin/client</text><rect x="215.0" y="170.0" width="160.0" height="68.0" rx="6" fill="#fff" stroke="#4338ca" stroke-width="2"/><text x="295.0" y="201.9" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#4338ca">SP1  64 8e..</text><text x="295.0" y="223.9" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">FOLLOWER</text><rect x="450.0" y="155.0" width="170.0" height="98.0" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/><text x="535.0" y="185.7" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#0f766e">SP4  e1 5d..</text><text x="535.0" y="207.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">COORDINATOR</text><text x="535.0" y="223.9" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">smr_put</text><text x="535.0" y="240.1" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">LOG #n</text><rect x="660.0" y="60.0" width="120.0" height="60.0" rx="6" fill="#fff" stroke="#4338ca" stroke-width="2"/><text x="720.0" y="87.9" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#4338ca">SP2  ac 1d..</text><text x="720.0" y="109.9" font-size=