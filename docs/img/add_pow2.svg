D = 32 bytes big-endian: byte 0 é o mais significativo, byte 31 o menos</text><rect x="10.0" y="34.0" width="118.0" height="40.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="69.0" y="58.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">byte 0</text><text x="69.0" y="92.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">bits 255..248</text><rect x="128.0" y="34.0" width="118.0" height="40.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="187.0" y="58.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">byte 1</text><text x="187.0" y="92.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">bits 247..240</text><rect x="246.0" y="34.0" width="70.0" height="40.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="281.0" y="58.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">...</text><rect x="316.0" y="34.0" width="118.0" height="40.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="375.0" y="58.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">byte 29</text><text x="375.0" y="92.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">bits 23..16</text><rect x="434.0" y="34.0" width="118.0" height="40.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="493.0" y="58.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">byte 30</text><text x="493.0" y="92.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">bits 15..8</text><rect x="552.0" y="34.0" width="118.0" height="40.0" rx="0" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="611.0" y="58.7" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">byte 31</text><text x="611.0" y="92.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#475569">bits 7..0</text><text x="10.0" y="126.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">Exemplo: id + 2^9  -&gt;  byte = 31 - 9/8 = 30,   soma = 1 &lt;&lt; (9 % 8) = 2</text><text x="10.0" y="162.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">antes (byte 29..31)</text><rect x="150.0" y="140.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="195.0" y="162.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">...</text><rect x="240.0" y="140.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="285.0" y="162.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">0x12</text><rect x="330.0" y="140.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="375.0" y="162.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">0xFF</text><rect x="420.0" y="140.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="465.0" y="162.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">0x40</text><text x="10.0" y="218.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">depois</text><rect x="150.0" y="196.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="195.0" y="218.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">...</text><rect x="240.0" y="196.0" width="90.0" height="36.0" rx="0" fill="#fef3c7" stroke="#4338ca" stroke-width="1.5"/><text x="285.0" y="218.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">0x13</text><rect x="330.0" y="196.0" width="90.0" height="36.0" rx="0" fill="#fef3c7" stroke="#4338ca" stroke-width="1.5"/><text x="375.0" y="218.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">0x01</text><rect x="420.0" y="196.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="465.0" y="218.7" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">0x40</text><path d="M375,177 C 360,190 300,180 290,194" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#ar-amber)"/><text x="10.0" y="260.7" font-size="13.5" text-anchor="start" font-weight="bold" fill="#b45309">0xFF + 0x02 = 0x101: o byte fica 0x01 e o vai-um soma 1 no byte à esquerda (0x12 -&gt; 0x13)</text><text x="560.0" y="164.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">laço: soma += out[byte];</text><text x="560.0" y="184.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">out[byte] = soma &amp; 0xFF;</text><text x="560.0" y="204.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1e293b" font-family="Cascadia Mono, Consolas, monospace">soma &gt;&gt;= 8; byte--;</text><text x="560.0" y="226.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">passou do byte 0:</text><text x="560.0" y="244.7" font-size="13.5" text-anchor="start" font-weight="normal" fill="#475569">descarta 