<svg xmlns="http://www.w3.org/2000/svg" style="background:#fff" viewBox="0 0 780 430" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14"><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ar-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker><marker id="ar-cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="40.0" y="20.0" width="380.0" height="50.0" rx="6" fill="#eceafd" stroke="#4338ca" stroke-width="2"/><text x="230.0" y="50.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4338ca">trava smr_order_mutex</text><line x1="230.0" y1="70.0" x2="230.0" y2="92.0" stroke="#1e293b" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="40.0" y="94.0" width="380.0" height="50.0" rx="6" fill="#fff" stroke="#4338ca" stroke-width="2"/><text x="230.0" y="124.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4338ca">metadata_serialize(meta)</text><line x1="230.0" y1="144.0" x2="230.0" y2="166.0" stroke="#1e293b" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="40.0" y="168.0" width="380.0" height="50.0" rx="6" fill="#eceafd" stroke="#4338ca" stroke-width="2"/><text x="230.0" y="198.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4338ca">smr_put_local (com smr_mutex)</text><line x1="230.0" y1="218.0" x2="230.0" y2="240.0" stroke="#1e293b" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="40.0" y="242.0" width="380.0" height="50.0" rx="6" fill="#eceafd" stroke="#4338ca" stroke-width="2"/><text x="230.0" y="272.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4338ca">smr_replicate: LOG_APPEND a cada ALIVE</text><line x1="230.0" y1="292.0" x2="230.0" y2="314.0" stroke="#1e293b" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="40.0" y="316.0" width="380.0" height="50.0" rx="6" fill="#eceafd" stroke="#4338ca" stroke-width="2"/><text x="230.0" y="346.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4338ca">free + solta smr_order_mutex</text><rect x="14.0" y="20.0" width="12.0" height="346.0" rx="2" fill="#eceafd" stroke="#4338ca" stroke-width="1.5"/><text x="14.0" y="390.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#4338ca">barra: smr_order_mutex travado (ordem total)</text><rect x="460.0" y="150.0" width="300.0" height="186.0" rx="6" fill="#fff" stroke="#4338ca" stroke-width="1.5"/><text x="610.0" y="172.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4338ca" font-family="Cascadia Mono, Consolas, monospace">smr_put_local</text><text x="475.0" y="196.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">1. index = last_applied + 1</text><text x="475.0" y="214.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">2. timestamp = ++relógio</text><text x="475.0" y="232.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">3. txid com ++sequência</text><text x="475.0" y="250.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">4. checksum SHA-256</text><text x="475.0" y="268.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">5. imprime LOG #, PUT, TransactionID</text><text x="475.0" y="286.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">6. metadata_table_insert</text><text x="475.0" y="304.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">7. metadata_add_provider</text><text x="475.0" y="322.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">8. guarda no vetor, last_applied++</text><line x1="420.0" y1="193.0" x2="458.0" y2="193.0" stroke="#4338ca" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-a2)"/><text x="460.0" y="30.0" font-size="13" text-anchor="start" font-weight="bold" fill="#b91c1c">Falha local (nome já usado, log cheio):</text><text x="460.0" y="48.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">não guarda, não replica, peer recebe ERROR.</text><text x="460.0" y="80.0" font-size="13" text-anchor="start" font-weight="bold" fill="#b45309">Follower que recusa ou não responde:</text><text x="460.0" y="98.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">só imprime &quot;LOG_APPEND #n: X ...&quot;;</text><text x="460.0" y="116.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1e293b">o PUT já valeu no coordenador (ACK).</text><text x="390.0" y="418.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#475569">O tratamento de LOG_APPEND nunca trava smr_order_mutex: não há espera circular.</text></svg>