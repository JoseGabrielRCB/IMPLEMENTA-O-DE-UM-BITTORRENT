-ink)"/><line x1="30.0" y1="80.0" x2="30.0" y2="100.0" stroke="#1e293b" stroke-width="2"/><text x="30.0" y="70.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b">0 s</text><line x1="234.4" y1="80.0" x2="234.4" y2="100.0" stroke="#1e293b" stroke-width="2"/><text x="234.4" y="70.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b">8 s</text><line x1="285.6" y1="80.0" x2="285.6" y2="100.0" stroke="#1e293b" stroke-width="2"/><text x="285.6" y="70.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b">10 s</text><line x1="720.0" y1="80.0" x2="720.0" y2="100.0" stroke="#1e293b" stroke-width="2"/><text x="720.0" y="70.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e293b">27 s</text><rect x="10.0" y="110.0" width="140.0" height="46.0" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="80.0" y="129.6" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">sobe SP1..SP4</text><text x="80.0" y="145.8" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">c4.conf (CSV)</text><rect x="170.0" y="110.0" width="120.0" height="46.0" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="230.0" y="129.6" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">kill -9 SP4</text><text x="230.0" y="145.8" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">(antes da eleição)</text><rect x="230.0" y="170.0" width="150.0" height="46.0" rx="4" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="305.0" y="189.6" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">eleição entre</text><text x="305.0" y="205.8" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1e293b">SP1, SP2 e SP3</text><rect x="640.0" y="110.0" width="140.0" height="46.0" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="710.0" y="129.6" font-size="13.5" text-anchor="